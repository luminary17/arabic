name: Deploy Natiq to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build the application
        run: npm run build
      - name: Render the home page
        shell: bash
        run: |
          mkdir -p _site
          cp -R dist/client/. _site/
          npx vinext start --port 3000 > /tmp/natiq-server.log 2>&1 &
          server_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > _site/index.html; then
              break
            fi
            sleep 1
          done
          kill "$server_pid" || true
          test -s _site/index.html
          sed -i 's|href="/|href="/arabic/|g; s|src="/|src="/arabic/|g; s|content="http://localhost:3000/|content="https://luminary17.github.io/arabic/|g' _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
